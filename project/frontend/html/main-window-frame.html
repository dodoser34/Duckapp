<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="../html/assets/icon.ico" type="image/x-icon">

    <title data-i18n="title">duckapp</title>

    <link rel="stylesheet" href="../styles/base/main-window/layout.css">
    <link rel="stylesheet" href="../styles/base/main-window/feedback.css">
    <link rel="stylesheet" href="../styles/base/main-window/modal-helper.css">
    <link rel="stylesheet" href="../styles/base/main-window/responsive.css">

    <script type="module" src="../js/main.js" defer></script>
    <script type="module" src="../js/translate-page.js" defer></script>
</head>

<body data-page="main_page">
<div id="ducks"></div>

<header>
    <div class="logo" data-i18n="logo"></div>
    <nav>
        <a id="aboutSiteBtn" data-i18n="aboutSiteBtn"></a>
        <a id="aboutUsBtn" data-i18n="aboutUsBtn"></a>
    </nav>
</header>

<section class="hero">
    <div class="hero-text">
        <h1 data-i18n="hero-text_h1"></h1>
        <p data-i18n="hero-text_p"></p>
        <button id="start-chat-btn" data-i18n="hero-text_button"></button>
    </div>

    <div>
        <div class="slider">
            <div class="slides">
                <img src="assets/logo_main_window.png" data-i18n-attr="alt:main_logo_alt">
            </div>
        </div>
    </div>
</section>

<section class="features features-classic-animated">
    <div class="feature-card">
        <span data-i18n="feature1_icon"></span>
        <h3 data-i18n="1hero-text_h3"></h3>
        <p data-i18n="1hero-text_p"></p>
    </div>

    <div class="feature-card">
        <span data-i18n="feature2_icon"></span>
        <h3 data-i18n="2hero-text_h3"></h3>
        <p data-i18n="2hero-text_p"></p>
    </div>

    <div class="feature-card">
        <span data-i18n="feature3_icon"></span>
        <h3 data-i18n="3hero-text_h3"></h3>
        <p data-i18n="3hero-text_p"></p>
    </div>
</section>

<section class="hero hero-qr">
    <div class="qhero-text">
        <p data-i18n="qhero-text_p"></p>
    </div>

    <div>
        <div class="sliderq">
            <div class="slidesq">
                <img src="assets/qr-code.png" data-i18n-attr="alt:qr_code_alt">
            </div>
        </div>
    </div>
</section>

<section class="stats" id="stats">
    <div class="stat">
        <h3 id="active-users-counter" data-counter="17362">0</h3>
        <p data-i18n="Auhero-text"></p>
    </div>

    <div class="stat">
        <h3 id="uptime-counter" data-counter="93.7" data-decimal="true">0</h3>
        <p data-i18n="Uphero-text"></p>
    </div>
</section>

<section class="feedback-section" id="feedback-section">
    <div class="feedback-card">
        <h2 data-i18n="feedback_title"></h2>
        <p class="feedback-subtitle" data-i18n="feedback_subtitle"></p>

        <form id="feedback-form" class="feedback-form">
            <label for="feedback-nickname" data-i18n="feedback_nickname_label"></label>
            <input
                type="text"
                id="feedback-nickname"
                name="nickname"
                maxlength="30"
                required
                data-i18n="feedback_nickname_placeholder"
            >

            <label for="feedback-problem-type" data-i18n="feedback_problem_type_label"></label>
            <div class="feedback-select-wrap" id="feedback-problem-type-wrap">
                <select id="feedback-problem-type" name="problem_type" required>
                    <option value="" selected disabled data-i18n="feedback_problem_type_placeholder"></option>
                    <option value="bug" data-i18n="feedback_problem_type_bug"></option>
                    <option value="ui" data-i18n="feedback_problem_type_ui"></option>
                    <option value="performance" data-i18n="feedback_problem_type_performance"></option>
                    <option value="security" data-i18n="feedback_problem_type_security"></option>
                    <option value="other" data-i18n="feedback_problem_type_other"></option>
                </select>
                <button
                    id="feedback-problem-type-trigger"
                    class="feedback-select-trigger"
                    type="button"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                ></button>
                <ul id="feedback-problem-type-menu" class="feedback-select-menu" role="listbox"></ul>
            </div>

            <label for="feedback-description" data-i18n="feedback_description_label"></label>
            <textarea
                id="feedback-description"
                name="description"
                rows="4"
                maxlength="2000"
                required
                data-i18n="feedback_description_placeholder"
            ></textarea>

            <label for="feedback-reproduce" data-i18n="feedback_reproduce_label"></label>
            <textarea
                id="feedback-reproduce"
                name="reproduction"
                rows="4"
                maxlength="2000"
                required
                data-i18n="feedback_reproduce_placeholder"
            ></textarea>

            <label for="feedback-recommendation" data-i18n="feedback_recommendation_label"></label>
            <textarea
                id="feedback-recommendation"
                name="recommendation"
                rows="4"
                maxlength="2000"
                required
                data-i18n="feedback_recommendation_placeholder"
            ></textarea>

            <div class="feedback-form-actions">
                <button id="feedback-submit" type="submit" data-i18n="feedback_submit_btn"></button>
                <button id="feedback-open-list" type="button" data-i18n="feedback_view_btn"></button>
            </div>
            <div id="feedback-status" class="feedback-status" aria-live="polite"></div>
        </form>
    </div>
</section>

<footer data-i18n="footer"></footer>

<button
    id="site-helper-toggle"
    class="site-helper-toggle"
    data-i18n="site_helper_toggle"
    data-i18n-attr="aria-label:site_helper_toggle_aria;title:site_helper_toggle_aria"
></button>

<aside id="site-helper-panel" class="site-helper-panel" aria-hidden="true">
    <div class="site-helper-header">
        <h3 data-i18n="site_helper_panel_title"></h3>
        <button
            id="site-helper-close"
            class="site-helper-close"
            data-i18n="site_helper_close"
            data-i18n-attr="aria-label:site_helper_close_aria;title:site_helper_close_aria"
        ></button>
    </div>

    <div class="site-helper-content">
        <section class="site-helper-block">
            <h4 data-i18n="site_helper_registration_title"></h4>
            <ul>
                <li data-i18n="site_helper_registration_step_1"></li>
                <li data-i18n="site_helper_registration_step_2"></li>
                <li data-i18n="site_helper_registration_step_3"></li>
            </ul>
        </section>

        <section class="site-helper-block">
            <h4 data-i18n="site_helper_navigation_title"></h4>
            <ul>
                <li data-i18n="site_helper_navigation_item_1"></li>
                <li data-i18n="site_helper_navigation_item_2"></li>
                <li data-i18n="site_helper_navigation_item_3"></li>
            </ul>
        </section>

        <section class="site-helper-block">
            <h4 data-i18n="site_helper_more_title"></h4>
            <ul>
                <li data-i18n="site_helper_more_item_1"></li>
                <li data-i18n="site_helper_more_item_2"></li>
                <li data-i18n="site_helper_more_item_3"></li>
            </ul>
        </section>

        <div class="site-helper-actions">
            <button
                id="site-helper-start-chat"
                class="site-helper-action-btn primary"
                type="button"
                data-i18n="hero-text_button"
            ></button>
            <button
                id="site-helper-open-feedback-form"
                class="site-helper-action-btn"
                type="button"
                data-i18n="feedback_submit_btn"
            ></button>
            <button
                id="site-helper-open-feedback-list"
                class="site-helper-action-btn ghost"
                type="button"
                data-i18n="feedback_view_btn"
            ></button>
        </div>
    </div>
</aside>

<div id="feedbackListModal" class="modal feedback-list-modal">
    <div class="modal-content feedback-list-modal-content">
        <span class="close" data-i18n="modal_close"></span>
        <h2 data-i18n="feedback_view_title"></h2>
        <p class="feedback-list-subtitle" data-i18n="feedback_view_subtitle"></p>
        <div id="feedback-list-body" class="feedback-list-body"></div>
        <section id="feedback-admin-panel" class="feedback-admin-panel">
            <h3>Войти как админ</h3>
            <p class="feedback-admin-subtitle">Введите спец-код из .env, чтобы менять статусы заявок.</p>
            <div class="feedback-admin-actions">
                <input
                    id="feedback-admin-code"
                    class="feedback-admin-code"
                    type="password"
                    maxlength="512"
                    autocomplete="off"
                    placeholder="Спец-код администратора"
                >
                <button id="feedback-admin-login" type="button">Войти как админ</button>
                <button id="feedback-admin-logout" type="button" class="feedback-admin-logout" hidden>
                    Выйти из админа
                </button>
            </div>
            <div id="feedback-admin-status" class="feedback-admin-status" aria-live="polite"></div>
        </section>
    </div>
</div>



<div id="aboutSiteModal" class="modal">
    <div class="modal-content">
        <span class="close" data-i18n="modal_close"></span>
        <h2 data-i18n="aboutSiteModal-title"></h2>
        <div class="modal-block">
            <h3 data-i18n="aboutSiteModal-concept_title"></h3>
            <p data-i18n="aboutSiteModal-concept_text"></p>
        </div>
        <div class="modal-block">
            <h3 data-i18n="aboutSiteModal-style_title"></h3>
            <p data-i18n="aboutSiteModal-style_text"></p>
        </div>
        <div class="modal-block">
            <h3 data-i18n="aboutSiteModal-theme_title"></h3>
            <p data-i18n="aboutSiteModal-theme_text"></p>
        </div>
    </div>
</div>

<div id="aboutUsModal" class="modal">
    <div class="modal-content">
        <span class="close" data-i18n="modal_close"></span>
        <h2 data-i18n="aboutUsModal-title"></h2>

        <div class="team-member">
            <h3 data-i18n="aboutUsModal-member1_name"></h3>
            <p data-i18n="aboutUsModal-member1_role"></p>
            <p data-i18n="aboutUsModal-member1_text"></p>
            <a
                href="https://github.com/dodoser34"
                class="team-link-primary"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="aboutUsModal-member1_github"
                data-i18n-attr="aria-label:aboutUsModal-member1_github_aria;title:aboutUsModal-member1_github_aria"
            ></a>
            <a
                href="https://t.me/Dodoser34"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="aboutUsModal-member1_telegram"
                data-i18n-attr="aria-label:aboutUsModal-member1_telegram_aria;title:aboutUsModal-member1_telegram_aria"
            ></a>
        </div>

        <div class="team-member">
            <h3 data-i18n="aboutUsModal-member2_name"></h3>
            <p data-i18n="aboutUsModal-member2_role"></p>
            <p data-i18n="aboutUsModal-member2_text"></p>
            <a
                href="https://github.com/Teych-Man"
                class="team-link-primary"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="aboutUsModal-member2_github"
                data-i18n-attr="aria-label:aboutUsModal-member2_github_aria;title:aboutUsModal-member2_github_aria"
            ></a>
            <a
                href="https://t.me/Teych_Man"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="aboutUsModal-member2_telegram"
                data-i18n-attr="aria-label:aboutUsModal-member2_telegram_aria;title:aboutUsModal-member2_telegram_aria"
            ></a>
        </div>
    </div>
</div>
</body>
</html>
