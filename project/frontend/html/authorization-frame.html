<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title data-i18n="title">duckapp</title>

    <link rel="stylesheet" href="../styles/base/auth.css">
    <link rel="icon" href="../html/assets/icon.ico" type="image/x-icon">

    <script type="module" src="../js/translate-page.js" defer></script>
    <script type="module" src="../js/auth.js" defer></script>
</head>

<body data-page="authorization">
    <div id="ducks"></div>

    <div class="authorization-container">
        <a class="logo" href="main-window-frame.html" data-i18n="logo"></a>

        <h2 data-i18n="title"></h2>

        <form id="loginForm" autocomplete="on">
            <div class="input-group">
                <input type="text" id="username" name="username" data-i18n="username_input" maxlength="32" required>
                <label for="username" data-i18n="username"></label>
            </div>

            <div class="input-group password-group">
                <input type="password" id="password" name="password" data-i18n="password_input" minlength="3" required>
                <label for="password" data-i18n="password"></label>
                <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password visibility" title="Toggle password visibility"></button>
            </div>

            <button type="submit" data-i18n="button-text"></button>
        </form>


        <div class="error" id="errorMsg" data-i18n="error-text"></div>

        <button type="button" class="forgot-link" id="recoveryToggle" aria-expanded="false" data-i18n="forgot_link"></button>

        <form id="recoveryForm" class="recovery-panel" autocomplete="on" hidden>
            <div class="recovery-title" data-i18n="recovery_title"></div>

            <div class="input-group">
                <input type="email" id="recoveryEmail" name="recoveryEmail" data-i18n="recovery_email_input" required>
                <label for="recoveryEmail" data-i18n="recovery_email"></label>
            </div>

            <button type="button" class="secondary-action" id="recoverySendCode" data-i18n="recovery_send_code"></button>

            <div class="recovery-code-step" id="recoveryCodeStep" hidden>
                <div class="input-group">
                    <input type="text" id="recoveryCode" name="recoveryCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" data-i18n="recovery_code_input" required>
                    <label for="recoveryCode" data-i18n="recovery_code"></label>
                </div>

                <div class="input-group">
                    <input type="text" id="recoveryUsername" name="recoveryUsername" maxlength="32" data-i18n="recovery_new_username_input" required>
                    <label for="recoveryUsername" data-i18n="recovery_new_username"></label>
                </div>

                <div class="input-group password-group">
                    <input type="password" id="recoveryPassword" name="recoveryPassword" minlength="8" data-i18n="recovery_new_password_input" required>
                    <label for="recoveryPassword" data-i18n="recovery_new_password"></label>
                    <button type="button" class="password-toggle" data-target="recoveryPassword" aria-label="Toggle password visibility" title="Toggle password visibility"></button>
                </div>

                <div class="input-group password-group">
                    <input type="password" id="recoveryConfirmPassword" name="recoveryConfirmPassword" minlength="8" data-i18n="recovery_confirm_password_input" required>
                    <label for="recoveryConfirmPassword" data-i18n="recovery_confirm_password"></label>
                    <button type="button" class="password-toggle" data-target="recoveryConfirmPassword" aria-label="Toggle password visibility" title="Toggle password visibility"></button>
                </div>

                <button type="submit" data-i18n="recovery_apply"></button>
            </div>

            <div class="recovery-message" id="recoveryMsg" aria-live="polite"></div>
        </form>

        <span class="noAccountToRegister">
            <span data-i18n="noAccount"></span>
            <a href="register-frame.html" data-i18n="noAccount_link"></a>
        </span>
    </div>

    <footer data-i18n="footer"></footer>
</body>
</html>
